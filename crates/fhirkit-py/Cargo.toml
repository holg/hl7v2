[package]
name = "fhirkit-py"
version = "0.1.0"          # lockstep with pyproject.toml; CI checks it
edition = "2021"
publish = false            # wheels only, never crates.io
license = "MIT OR Apache-2.0"

# Standalone package, not a member of the repository's Rust workspace: the
# workspace CI (cargo --workspace) must not need a Python toolchain.
[workspace]

[lib]
name = "fhirkit_native"    # -> python module fhirkit._native (see pyproject)
crate-type = ["cdylib", "rlib"]

[dependencies]
fhirkit = { path = "../fhirkit", version = "0.1" }
# abi3-py39: one wheel per platform serves Python 3.9 .. 3.13+. The
# extension-module feature is enabled by maturin (pyproject.toml), not
# here, so `cargo test` can link against a host interpreter.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
