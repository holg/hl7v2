[package]
name = "dicomscope"
version = "0.1.0"
description = "Demo for the hl7kit crate: a browser-only DICOM viewer that links a study to its HL7 v2 order"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The domain code lives in dicomscope-core and is shared with the desktop app.
# On the host this crate is the command-line companion (check, order, pack,
# fhir); in the browser it is the Leptos app.
[dependencies]
dicomscope-core = { path = "../dicomscope-core" }
hl7kit = { path = "../../crates/hl7kit" }
mwlkit = { path = "../../crates/mwlkit" }
dicom-dictionary-std = "0.10.0"
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Browser-only dependencies. Nothing here is compiled for the host target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.105", features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "Clipboard",
  "ImageData",
  "Navigator",
  "Selection",
  "Url",
  "DataTransfer",
  "DomRect",
  "DragEvent",
  "Element",
  "Event",
  "File",
  "FileList",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "WheelEvent",
  "Window",
] }
