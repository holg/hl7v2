[package]
name = "dicomscope-tui"
version = "0.1.0"
description = "dicomscope in the terminal: a ratatui viewer whose images are rendered by wgpu (Metal, Vulkan, DX12, GL) and shown inline, plus scriptable subcommands for tags, HL7 order linkage, FHIR and worklist items"
publish = false
readme = "README.md"
keywords = ["dicom", "hl7", "ratatui", "wgpu", "fhir"]
categories = ["command-line-utilities", "science", "visualization"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "dicomscope_tui"

[[bin]]
name = "dicomscope-tui"
path = "src/main.rs"

[features]
# EXPERIMENTAL, OFF BY DEFAULT, NOT FOR DISTRIBUTION: see dicomscope-core.
experimental-nerve = ["dicomscope-core/experimental-nerve"]

[dependencies]
dicomscope-core = { path = "../dicomscope-core" }
hl7kit = { path = "../../crates/hl7kit" }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
pollster = "0.4"
# Terminal and window, kitty/iTerm2/sixel/half blocks, the wgpu view
# (https://github.com/holg/scopekit).
scopekit = "0.1"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
dicomscope-core = { path = "../dicomscope-core", features = ["test-support"] }

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
