# xcodegen spec for the iPhone, iPad and Mac builds. `xcodegen generate` writes the Xcode
# project; the Rust library is built by a script phase and linked in. The
# generated project and the build folder are not committed.
name: dicomscope
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
settings:
  base:
    DEVELOPMENT_TEAM: U4GT5CZ7J7
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
targets:
  dicomscope:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - main.c
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: dicomscope
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "17"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # The app's Documents folder shows up in Finder and the Files app:
        # that is how studies and orders get onto the iPad.
        UIFileSharingEnabled: true
        # In place, so the folder shows in Files and in the document picker.
        # Apps without a file provider (Mail, Safari) still copy into
        # Documents/Inbox, which the app scans when it comes to the front.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: HL7 v2 message
            LSHandlerRank: Alternate
            LSItemContentTypes: [eu.iesna.hl7]
          - CFBundleTypeName: DICOM instance
            LSHandlerRank: Alternate
            LSItemContentTypes: [eu.iesna.dicom]
          - CFBundleTypeName: DICOM study archive
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: eu.iesna.hl7
            UTTypeDescription: HL7 v2 message
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [hl7]
              public.mime-type: [x-application/hl7-v2+er7]
          - UTTypeIdentifier: eu.iesna.dicom
            UTTypeDescription: DICOM instance
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dcm, dicom]
              public.mime-type: [application/dicom]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiredDeviceCapabilities: [arm64, metal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.iesna.dicomscope
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../../../target/aarch64-apple-ios/native"
        OTHER_LDFLAGS:
          - "-ldicomscope_desktop"
          - "-framework"
          - UIKit
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - CoreGraphics
          - "-framework"
          - Foundation
          - "-framework"
          - CoreFoundation
          - "-framework"
          - Security
    preBuildScripts:
      - name: Build the Rust library
        shell: /bin/sh
        script: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../../.."
          cargo build --profile native -p dicomscope-desktop --lib --target aarch64-apple-ios
        # Always run: cargo decides what is stale, Xcode must not.
        alwaysOutOfDate: true
  # The native Mac app from the same library: AppKit window, Metal surface,
  # the desktop file dialogs. Run it from the dicomscope-mac scheme.
  dicomscope-mac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - main.c
    info:
      path: Info-mac.plist
      properties:
        CFBundleName: dicomscope
        CFBundleDisplayName: dicomscope
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "17"
        LSApplicationCategoryType: public.app-category.medical
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: dicomscope
        PRODUCT_BUNDLE_IDENTIFIER: eu.iesna.dicomscope.mac
        ARCHS: arm64
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../../../target/aarch64-apple-darwin/native"
        OTHER_LDFLAGS:
          - "-ldicomscope_desktop"
          - "-framework"
          - AppKit
          - "-framework"
          - Carbon
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - CoreGraphics
          - "-framework"
          - Foundation
          - "-framework"
          - CoreFoundation
          - "-framework"
          - Security
    preBuildScripts:
      - name: Build the Rust library
        shell: /bin/sh
        script: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../../.."
          cargo build --profile native -p dicomscope-desktop --lib --target aarch64-apple-darwin
        alwaysOutOfDate: true
