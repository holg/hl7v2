name: fhir

# Generates the reference FHIR bundles from the committed samples with the
# host build of dicomscope (the same mapping the browser runs), validates
# them with the official HL7 FHIR validator against FHIR R4 and the MII
# Bildgebung package, fails on any validation error, and publishes bundles
# plus the validator report as an artifact. The pages workflow calls this
# and serves the artifact at /fhir/ on the demo site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  VALIDATOR_VERSION: 6.10.4
  FHIR_VERSION: 4.0.1
  MII_PACKAGE: de.medizininformatikinitiative.kerndatensatz.bildgebung#2025.0.0-ballot
  PYDICOM: https://raw.githubusercontent.com/pydicom/pydicom/main/src/pydicom/data/test_files

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the host tool
        run: cargo build --release -p dicomscope

      - name: Fetch the sample DICOM instance
        run: |
          mkdir -p samples/dicom
          curl -fsSL -o samples/dicom/MR_small.dcm "$PYDICOM/MR_small.dcm"

      - name: Generate reference bundles
        run: |
          mkdir -p out/fhir
          bin=target/release/dicomscope
          $bin fhir samples/dicom/MR_small.dcm samples/order.hl7          -o out/fhir/bundle-orm.json
          $bin fhir samples/dicom/MR_small.dcm samples/order-omi.hl7      -o out/fhir/bundle-omi.json
          $bin fhir samples/dicom/MR_small.dcm samples/order-mismatch.hl7 -o out/fhir/bundle-mismatch.json
          ls -la out/fhir

      - name: Cache the validator
        id: cache-validator
        uses: actions/cache@v4
        with:
          path: validator_cli.jar
          key: validator-cli-${{ env.VALIDATOR_VERSION }}

      - name: Download the validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: curl -fsSL -o validator_cli.jar "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"

      - name: Validate
        run: |
          set +e
          java -jar validator_cli.jar out/fhir/bundle-orm.json out/fhir/bundle-omi.json out/fhir/bundle-mismatch.json \
            -version "$FHIR_VERSION" -ig "$MII_PACKAGE" \
            -output out/fhir/validation.json > out/fhir/validation.txt 2>&1
          status=$?
          set -e
          grep -E 'Validate |errors,' out/fhir/validation.txt || true
          if [ "$status" -ne 0 ]; then
            echo "validator reported errors"; tail -60 out/fhir/validation.txt; exit 1
          fi

      - name: Write the report page
        run: |
          summary=$(grep -E 'errors,' out/fhir/validation.txt | sed 's/^/    /')
          cat > out/fhir/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>dicomscope FHIR reference bundles</title>
          <style>body{font:14px/1.5 system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem}pre{background:#f4f4f4;padding:.5rem;overflow:auto}</style>
          <h1>FHIR R4 reference bundles</h1>
          <p>Generated by <code>dicomscope fhir</code> from the committed samples and pydicom's <code>MR_small.dcm</code>,
          then validated with the HL7 FHIR validator ${VALIDATOR_VERSION} against FHIR ${FHIR_VERSION} with
          <code>${MII_PACKAGE}</code>. Built from commit <code>${GITHUB_SHA}</code> on $(date -u +%Y-%m-%dT%H:%MZ).</p>
          <ul>
            <li><a href="bundle-orm.json">bundle-orm.json</a>: ORM^O01 with ZDS, linked by study UID</li>
            <li><a href="bundle-omi.json">bundle-omi.json</a>: OMI^O23 with IPC, linked by study UID from IPC-3</li>
            <li><a href="bundle-mismatch.json">bundle-mismatch.json</a>: linked study, patient identifiers disagree</li>
            <li><a href="validation.txt">validation.txt</a>: validator output; <a href="validation.json">validation.json</a>: OperationOutcome</li>
          </ul>
          <h2>Result</h2>
          <pre>${summary}</pre>
          <p>Remaining warnings are documented in the <a href="https://github.com/holg/hl7v2/blob/main/demo/dicomscope/README.md#validation">demo README</a>:
          missing narrative (best practice), a code without a URI system, and DICOM value sets the validator cannot fetch.</p>
          <p><a href="../">Back to the demo</a></p>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: fhir-bundles
          path: out/fhir
          if-no-files-found: error
